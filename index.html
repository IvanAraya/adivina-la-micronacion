<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adivina la micronación</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="Juego para adivinar micronaciones a partir de su bandera">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Micronaciones">
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --accent: #7c3aed;
    --accent-hover: #6d28d9;
    --border: #e5e7eb;
    --correct: #16a34a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14141f;
      --card-bg: #1f1f2e;
      --text: #f0f0f5;
      --muted: #9ca3af;
      --accent: #a78bfa;
      --accent-hover: #8b5cf6;
      --border: #33334a;
      --correct: #4ade80;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14141f;
    --card-bg: #1f1f2e;
    --text: #f0f0f5;
    --muted: #9ca3af;
    --accent: #a78bfa;
    --accent-hover: #8b5cf6;
    --border: #33334a;
    --correct: #4ade80;
  }
  html, body {
    height: 100%;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    text-align: center;
    font-size: 1.4rem;
    margin: 0 0 20px;
  }
  .score {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }
  .flag {
    width: 100%;
    max-width: 240px;
    aspect-ratio: 3 / 2;
    margin: 0 auto 20px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .flag img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #ffffff;
  }
  .credit {
    min-height: 14px;
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .credit a {
    color: inherit;
  }
  .answer {
    min-height: 32px;
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--correct);
  }
  .answer.hidden-text {
    color: var(--muted);
    font-weight: 400;
    font-size: 1rem;
  }
  .hint {
    min-height: 18px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-reveal {
    background: var(--accent);
    color: white;
  }
  .btn-reveal:hover { background: var(--accent-hover); }
  .btn-next {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn-next:hover { background: rgba(124,58,237,0.08); }
  .btn-reset {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-reset:hover { background: rgba(107,114,128,0.1); }
  .footer-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: none;
  }
  .footer-link:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <h1>🏴 Adivina la micronación</h1>
  <div class="score" id="score">Vistas: 0 · Total de micronaciones: 0</div>
  <div class="card">
    <div class="flag" id="flagBox"></div>
    <div class="answer hidden-text" id="answerText">¿De qué micronación es esta bandera?</div>
    <div class="hint" id="hintText"></div>
    <div class="credit" id="creditText"></div>
    <div class="buttons">
      <button class="btn-reveal" id="revealBtn">Revelar</button>
      <button class="btn-next" id="nextBtn">Siguiente</button>
      <button class="btn-reset" id="resetBtn">Reiniciar</button>
    </div>
  </div>
  <a class="footer-link" href="https://ivanaraya.github.io/adivina-la-bandera/">Jugar con banderas de países →</a>
</div>

<script>
  // Micronaciones: entidades que se autoproclaman naciones o estados soberanos
  // sin reconocimiento internacional. No poseen código ISO 3166-1, por lo que
  // no existe un emoji de bandera para ellas: cada bandera se carga directamente
  // desde el archivo real publicado en Wikimedia Commons (Special:FilePath
  // apunta siempre al archivo vigente, sin depender del hash de subida).
  const COMMONS = "https://commons.wikimedia.org/wiki/Special:FilePath/";
  const micronations = [
    {
      name: "Principado de Sealand",
      hint: "Antigua plataforma militar en el mar del Norte, frente a las costas de Reino Unido",
      img: COMMONS + "Flag_of_Sealand.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_Sealand.svg"
    },
    {
      name: "República de Molossia",
      hint: "Micronación en el desierto de Nevada, Estados Unidos",
      img: COMMONS + "Flag_of_the_Republic_of_Molossia.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_the_Republic_of_Molossia.svg"
    },
    {
      name: "Ladonia",
      hint: "Micronación artística en la costa sur de Suecia",
      img: COMMONS + "Flag_of_Ladonia.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_Ladonia.svg"
    },
    {
      name: "Reino de Talossa",
      hint: "Una de las micronaciones más antiguas, fundada por un adolescente en Wisconsin, EE. UU.",
      img: COMMONS + "Flag_of_the_Kingdom_of_Talossa.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_the_Kingdom_of_Talossa.svg"
    },
    {
      name: "República Libre de Liberland",
      hint: "Territorio en disputa entre Serbia y Croacia, a orillas del río Danubio",
      img: COMMONS + "Flag_of_Liberland.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_Liberland.svg"
    },
    {
      name: "Principado de Seborga",
      hint: "Pueblo en la región italiana de Liguria que se declara principado independiente",
      img: COMMONS + "Flag_of_the_Principality_of_Seborga_(current).svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_the_Principality_of_Seborga_(current).svg"
    },
    {
      name: "Freetown Christiania",
      hint: "Comuna autogestionada dentro de la ciudad de Copenhague, Dinamarca",
      img: COMMONS + "Flag_of_Christiania.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_Christiania.svg"
    },
    {
      name: "Imperio de Atlantium",
      hint: "Micronación fundada en Australia que se declara un imperio global",
      img: COMMONS + "Bandera_d%27Atlantium.svg",
      source: "https://commons.wikimedia.org/wiki/File:Bandera_d'Atlantium.svg"
    },
    {
      name: "Gran Ducado de Westarctica",
      hint: "Micronación que reclama un sector no reivindicado de la Antártida",
      img: COMMONS + "Flag_of_Westarctica.png",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_Westarctica.png"
    },
    {
      name: "Principado de Hutt River",
      hint: "Antigua explotación agrícola en Australia Occidental que se declaró independiente en 1970",
      img: COMMONS + "Hutt_River_Flag.svg",
      source: "https://commons.wikimedia.org/wiki/File:Hutt_River_Flag.svg"
    },
    {
      name: "República de Zaqistán",
      hint: "Micronación en un enclave del desierto occidental de Utah, EE. UU., cuyo símbolo es un calamar gigante",
      img: COMMONS + "Zaqistan_flag.png",
      source: "https://commons.wikimedia.org/wiki/File:Zaqistan_flag.png"
    },
    {
      name: "Reino de Redonda",
      hint: "Islote deshabitado del Caribe, cerca de Antigua y Barbuda, con un título nobiliario disputado por escritores",
      img: COMMONS + "Flag_of_the_Kingdom_of_Redonda.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_the_Kingdom_of_Redonda.svg"
    },
    {
      name: "República de Užupis",
      hint: "Barrio bohemio de Vilna, Lituania, que se declaró república independiente el 1 de abril",
      img: COMMONS + "Flag_of_the_Republic_of_Uzupis.gif",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_the_Republic_of_Uzupis.gif"
    },
    {
      name: "Reinos de Elgaland-Vargaland",
      hint: "Micronación conceptual creada por dos artistas suecos, que reclama todas las fronteras y espacios digitales del mundo",
      img: COMMONS + "Elgaland-Vargaland_flag.png",
      source: "https://commons.wikimedia.org/wiki/File:Elgaland-Vargaland_flag.png"
    },
    {
      name: "República de Kugelmugel",
      hint: "Micronación formada por una casa con forma de esfera en Viena, Austria",
      img: COMMONS + "Flag_of_Kugelmugel_in_Austria.png",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_Kugelmugel_in_Austria.png"
    },
    {
      name: "Reino de Araucanía y Patagonia",
      hint: "Reclamo histórico sobre territorio mapuche en el sur de Chile y Argentina, proclamado en 1860 por un abogado francés",
      img: COMMONS + "Flag_of_the_Kingdom_of_Araucan%C3%ADa_and_Patagonia.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_the_Kingdom_of_Araucan%C3%ADa_and_Patagonia.svg"
    },
    {
      name: "República de la Isla de las Rosas",
      hint: "Plataforma artificial en el mar Adriático frente a Italia, demolida por el gobierno italiano en 1969",
      img: COMMONS + "Rose_Island_Flag.svg",
      source: "https://commons.wikimedia.org/wiki/File:Rose_Island_Flag.svg"
    },
    {
      name: "República de Conch (Cayo Hueso)",
      hint: "Cayo Hueso, Florida, se \"independizó\" en broma de EE. UU. en 1982 tras un control policial en la carretera de acceso",
      img: COMMONS + "Flag_of_Key_West,_Florida.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_Key_West,_Florida.svg"
    },
    {
      name: "República de Minerva",
      hint: "Arrecifes artificiales en el Pacífico Sur, cerca de Tonga, proclamados por libertarios en 1972 y anexados poco después por Tonga",
      img: COMMONS + "Flag_Minerva.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_Minerva.svg"
    },
    {
      name: "República Libre de Saugeais",
      hint: "Región del este de Francia que desde 1947 mantiene una \"república\" folclórica, visitada por varios presidentes franceses",
      img: COMMONS + "Flag_of_Saugeais.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_Saugeais.svg"
    },
    {
      name: "Gran Ducado de Flandrensis",
      hint: "Micronación que reclama islas de la Antártida, fundada por un ambientalista belga",
      img: COMMONS + "Flag_of_Flandrensis.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_Flandrensis.svg"
    },
    {
      name: "Principado de Outer Baldonia",
      hint: "Micronación fundada en 1948 por un club de pesca en una isla de Nueva Escocia, Canadá",
      img: COMMONS + "Flag_of_Outer_Baldonia.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_Outer_Baldonia.svg"
    },
    {
      name: "Imperio de Austenasia",
      hint: "Una de las micronaciones \"de dormitorio\" más activas del Reino Unido, fundada en 2008 por un adolescente",
      img: COMMONS + "Flag_of_Austenasia.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_Austenasia.svg"
    },
    {
      name: "Imperio Aericano",
      hint: "Micronación satírica canadiense fundada en 1987; su bandera reemplaza la hoja de arce de Canadá por una cara sonriente",
      img: COMMONS + "Flag_of_Aerica.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_Aerica.svg"
    },
    {
      name: "Estados Libres Ambulantes de Obsidia",
      hint: "Micronación feminista y portátil fundada en 2015 por una artista de California; su territorio es un trozo de roca de obsidiana que cabe en un maletín",
      img: COMMONS + "Flag_of_the_Ambulatory_Free_States_of_Obsidia.svg",
      source: "https://commons.wikimedia.org/wiki/File:Flag_of_the_Ambulatory_Free_States_of_Obsidia.svg"
    }
  ];

  const flagBox = document.getElementById("flagBox");
  const answerEl = document.getElementById("answerText");
  const hintEl = document.getElementById("hintText");
  const creditEl = document.getElementById("creditText");
  const revealBtn = document.getElementById("revealBtn");
  const nextBtn = document.getElementById("nextBtn");
  const resetBtn = document.getElementById("resetBtn");
  const scoreEl = document.getElementById("score");

  let current = null;
  let seenCount = 0;
  let revealed = false;

  function pickRandom() {
    const idx = Math.floor(Math.random() * micronations.length);
    return micronations[idx];
  }

  function updateScoreText() {
    scoreEl.textContent = "Vistas: " + seenCount + " · Total de micronaciones: " + micronations.length;
  }

  function newRound() {
    current = pickRandom();
    flagBox.innerHTML = "";
    const img = document.createElement("img");
    img.src = current.img;
    img.alt = "Bandera de " + current.name;
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    flagBox.appendChild(img);
    answerEl.textContent = "¿De qué micronación es esta bandera?";
    answerEl.classList.add("hidden-text");
    hintEl.textContent = "";
    creditEl.innerHTML = "";
    revealed = false;
    revealBtn.textContent = "Revelar";
  }

  function reveal() {
    if (!revealed) {
      answerEl.textContent = current.name;
      answerEl.classList.remove("hidden-text");
      hintEl.textContent = current.hint;
      creditEl.innerHTML = 'Imagen: <a href="' + current.source + '" target="_blank" rel="noopener">Wikimedia Commons</a>';
      revealed = true;
      seenCount++;
      updateScoreText();
    }
  }

  function resetGame() {
    seenCount = 0;
    updateScoreText();
    newRound();
  }

  revealBtn.addEventListener("click", reveal);
  nextBtn.addEventListener("click", newRound);
  resetBtn.addEventListener("click", resetGame);

  updateScoreText();
  newRound();

  // Registro del service worker para funcionamiento offline (PWA)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./service-worker.js")
        .catch((err) => console.error("Error al registrar el service worker:", err));
    });
  }
</script>
</body>
</html>
